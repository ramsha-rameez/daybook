<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook – Plan your day, finish your day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="panel">
    <div class="brand">Daybook</div>
    <div>
      <p class="date" id="date"></p>
      <h1 id="greeting">Good day.</h1>
    </div>

    <div class="ring-wrap">
      <svg viewBox="0 0 140 140" class="ring" role="img" aria-label="Progress of today's tasks">
        <circle cx="70" cy="70" r="54" class="track"/>
        <circle cx="70" cy="70" r="54" class="bar" id="bar"/>
      </svg>
      <div class="ring-text"><span id="percent">0%</span></div>
    </div>

    <p class="summary" id="summary">Add your first task to begin.</p>
  </aside>

  <main class="board">
    <form id="form" class="add">
      <input id="input" type="text" placeholder="What do you need to finish today?" maxlength="80" autocomplete="off" aria-label="New task">
      <button type="submit">Add task</button>
    </form>

    <div class="bar-row">
      <div class="tabs" role="group" aria-label="Filter tasks">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="active">To do</button>
        <button class="tab" data-filter="done">Done</button>
      </div>
      <button class="link" id="clear">Clear completed</button>
    </div>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty"></p>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
